<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Forecast First</title>
<style>
  body { width: 300px; margin: 0; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #171a24; color: #e8eaf0; }
  .wrap { padding: 14px 16px; }
  h1 { font-size: 13px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; letter-spacing: .06em; text-transform: uppercase; color: #8b93ff; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 0; }
  .muted { color: #7d8397; font-size: 12px; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid rgba(255,255,255,.14); background: transparent; color: #c8ccd8; padding: 6px 10px; }
  button:hover { background: rgba(255,255,255,.06); color: #fff; }
  button.primary { background: #6c74ff; border-color: transparent; color: #fff; font-weight: 600; }
  button.primary:hover { background: #7f86ff; }
  .toggle { position: relative; width: 38px; height: 22px; background: #3a3f52; border-radius: 999px; cursor: pointer; transition: background .15s; }
  .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .toggle.on { background: #6c74ff; } .toggle.on::after { transform: translateX(16px); }
  .stat { font-size: 22px; font-weight: 700; color: #fff; }
  hr { border: 0; border-top: 1px solid rgba(255,255,255,.08); margin: 10px 0; }
  .page { background: #0f1119; border-radius: 8px; padding: 8px 10px; font-size: 12px; }
  .page b { color: #fff; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .warn { color: #ffb86e; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🙈 Forecast First</h1>
  <div class="row"><span>Enabled</span><div id="enabled" class="toggle" role="switch" tabindex="0"></div></div>
  <div class="row" id="pauseRow"><span class="muted" id="pauseText"></span><button id="pauseBtn">Pause 1 hour</button></div>
  <hr>
  <div id="page" class="page" hidden>
    <span class="muted" id="pageSite"></span>
    <b id="pageTitle"></b>
    <div class="actions">
      <button id="revealBtn" hidden>Reveal without forecasting</button>
      <button id="againBtn" hidden>Ask me again here</button>
    </div>
  </div>
  <hr>
  <div class="row"><span>Forecasts logged</span><span class="stat" id="count">0</span></div>
  <div id="fbWarn" class="warn" hidden>Fatebook API key not set — forecasts stay local only.</div>
  <div class="row" style="margin-top:12px"><button id="optionsBtn" class="primary">History &amp; settings</button><a class="muted" href="https://fatebook.io" target="_blank" rel="noopener">fatebook.io ↗</a></div>
</div>
<script src="popup.js"></script>
</body>
</html>
